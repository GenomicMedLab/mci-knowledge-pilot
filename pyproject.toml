[project]
name = "mci_knowledge_pilot"
version = "0.1.0"
authors = [
    {name = "Matthew Cannon"},
    {name = "Anastasia Bratulin"},
    {name = "Kori Kuzma"},
    {name = "Daniel Puthawala"},
    {name = "Alex Wagner"},
]
readme = "README.md"
requires-python = ">=3.13,<3.14"
description = "Transform semi-structured somatic cancer variant classification knowledge into computable clinical assertions using GA4GH GKS"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "ipykernel",
    "polars",
    "wags_llm"
]

[project.optional-dependencies]
dev = [
    "prek>=0.2.23",
    "ruff==0.14.10",
]

[tool.ruff]
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # unused
    "AIR",
    "ERA",
    "YTT",
    "BLE",
    "FBT",
    "CPY",
    "DJ",
    "EXE",
    "FIX",
    "FA",
    "PYI",
    "TD",
    "C90",
    "NPY",
    "PD",
    # ignore for compatibility with formatter
    "D206",
    "D300",
    "W191",
    "E111",
    "E114",
    "E117",
    "E501",
    "W191",
    "S321",
    "COM812",
    "COM819",
    "Q000",
    "Q001",
    "Q002",
    "Q003",
    # don't require types on *args, **kwargs
    "ANN002",
    "ANN003",
    # subjective pylint thresholds
    "PLR0904",
    "PLR091",
    "PLR1702",
    "PLC0206",
    # misc unnecessary stuff
    "S321",
    "D203",
    "D205",
    "D213",
    "D400",
    "D415",
]

[tool.ruff.lint.per-file-ignores]
# ANN001 - missing-type-function-argument
# ANN2 - missing-return-type
# D100 - undocumented-public-module
# D102 - undocumented-public-class
# D103 - undocumented-public-function
# S101 - assert
# B011 - assert-false
# INP001 - implicit-namespace-package
# PLR2004 - magic-value-comparison
"tests/*" = [
    "ANN001",
    "ANN2",
    "D",
    "S101",
    "B011",
    "INP001",
    "PLR2004",
]

[tool.ruff.lint.flake8-annotations]
mypy-init-return = true

[tool.ruff.format]
docstring-code-format = true
